<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Processing Using Matrices</title>
<style>
:root{--bg:#fafafa;--fg:#1a1a1a;--card:#fff;--bd:#ddd;--ac:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--fg:#eee;--card:#1e1e1e;--bd:#333;--ac:#60a5fa}}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:1000px;margin:auto;padding:24px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
img{max-width:100%;border-radius:6px}
label{display:block;margin:10px 0 4px}
select,input[type=file]{width:100%;padding:6px}
a.btn{display:inline-block;margin-top:10px;padding:8px 14px;background:var(--ac);color:#fff;border-radius:6px;text-decoration:none}
#err{color:#dc2626}
</style></head><body><main>
<h1>Image Processing Using Matrices</h1>
<p>Linear Algebra project: an image is a matrix of numbers, and each operation is a matrix operation (NumPy).</p>
<div class="box">
  <input type="file" id="file" accept="image/*">
  <label>Operation</label>
  <select id="op">
    <option value="grayscale">Grayscale</option>
    <option value="brightness">Brightness</option>
    <option value="flip">Horizontal flip</option>
    <option value="bw">Black and white</option>
  </select>
  <div id="bBox" hidden><label>Brightness β: <b id="bv">50</b></label><input type="range" id="brightness" min="-100" max="100" value="50" style="width:100%"></div>
  <div id="tBox" hidden><label>Threshold T: <b id="tv">128</b></label><input type="range" id="threshold" min="0" max="255" value="128" style="width:100%"></div>
  <p id="err"></p>
</div>
<div class="grid">
  <div class="box"><h3>Original</h3><img id="orig" alt=""></div>
  <div class="box"><h3>Result</h3><img id="res" alt=""><br><a class="btn" id="dl" download="result.png" hidden>Save result</a></div>
</div>
<script>
const $=id=>document.getElementById(id);let t;
function ui(){const o=$("op").value;$("bBox").hidden=o!=="brightness";$("tBox").hidden=o!=="bw";$("bv").textContent=$("brightness").value;$("tv").textContent=$("threshold").value}
async function run(){
  ui();const f=$("file").files[0];if(!f)return;$("err").textContent="";
  const fd=new FormData();fd.append("image",f);
  for(const k of["op","brightness","threshold"])fd.append(k,$(k).value);
  try{const r=await fetch("/api/process",{method:"POST",body:fd});
    const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");
    $("orig").src=d.original;$("res").src=d.result;$("dl").href=d.result;$("dl").hidden=false;
  }catch(e){$("err").textContent=e.message}
}
["file","op"].forEach(i=>$(i).addEventListener("change",run));
["brightness","threshold"].forEach(i=>$(i).addEventListener("input",()=>{ui();clearTimeout(t);t=setTimeout(run,250)}));
ui();
</script></main></body></html>
